<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Pinball UI visual language and design tokens</title>
<desc id="desc">A design reference board showing the shared cream, ink, stone, line, amber and red palette, focus styling, typography, mechanical and utility component surface treatments.</desc>
<defs><style>
.bg{fill:#f3efe5}.title{font:700 34px Arial,sans-serif;fill:#2b2620}.heading{font:700 17px Arial,sans-serif;fill:#2b2620}.body{font:15px Arial,sans-serif;fill:#554d43}.small{font:12px Arial,sans-serif;fill:#766d62}.token{font:700 13px Arial,sans-serif;fill:#2b2620}.panel{fill:#fffaf0;stroke:#c9bead;stroke-width:1.5}.button{fill:#f0c77e;stroke:#a56821;stroke-width:1.5}.focus{fill:none;stroke:#d18420;stroke-width:4;stroke-dasharray:8 5}
</style></defs>
<rect class="bg" width="1400" height="820"/>
<text x="56" y="64" class="title">PINBALL UI · VISUAL LANGUAGE</text>
<text x="56" y="94" class="small">Warm workshop palette · high-contrast states · tactile surfaces · clear native semantics</text>
<rect class="panel" x="56" y="125" width="1288" height="240" rx="18"/>
<text x="82" y="162" class="heading">COLOR TOKENS</text>
<g>
<rect x="82" y="190" width="174" height="92" rx="10" fill="#f3efe5" stroke="#c9bead"/><text x="82" y="310" class="token">Cream · #f3efe5</text>
<rect x="280" y="190" width="174" height="92" rx="10" fill="#2b2620"/><text x="280" y="310" class="token">Ink · #2b2620</text>
<rect x="478" y="190" width="174" height="92" rx="10" fill="#7a7064"/><text x="478" y="310" class="token">Dim · #7a7064</text>
<rect x="676" y="190" width="174" height="92" rx="10" fill="#d9d1c1"/><text x="676" y="310" class="token">Line · #d9d1c1</text>
<rect x="874" y="190" width="174" height="92" rx="10" fill="#c9700f"/><text x="874" y="310" class="token">Amber · #c9700f</text>
<rect x="1072" y="190" width="174" height="92" rx="10" fill="#b3322b"/><text x="1072" y="310" class="token">Red · #b3322b</text>
</g>
<rect class="panel" x="56" y="392" width="620" height="364" rx="18"/>
<text x="82" y="430" class="heading">MECHANICAL SURFACE</text>
<rect x="82" y="458" width="568" height="130" rx="18" fill="#fffaf0" stroke="#c9bead" stroke-width="2"/>
<rect x="108" y="482" width="135" height="82" rx="40" fill="#e8e0d3" stroke="#a99f8e" stroke-width="2"/>
<circle cx="176" cy="523" r="29" fill="#b9c0c4" stroke="#6c7072" stroke-width="2"/><circle cx="167" cy="512" r="9" fill="#fff" opacity=".75"/>
<rect x="282" y="484" width="285" height="78" rx="14" fill="#f3efe5" stroke="#d9d1c1"/>
<circle cx="310" cy="522" r="8" fill="#c9700f"/><text x="332" y="515" class="heading">PinballKit</text><text x="332" y="540" class="small">Photographed plates · WebGL ball · recorded audio</text>
<text x="82" y="626" class="body">Serif page copy with compact uppercase sans-serif labels.</text>
<text x="82" y="654" class="small">Use --pb-size, --pb-page and --pb-focus for the mechanical family.</text>
<rect class="panel" x="700" y="392" width="644" height="364" rx="18"/>
<text x="726" y="430" class="heading">LIGHTWEIGHT UTILITY SURFACE</text>
<rect x="726" y="458" width="592" height="130" rx="18" fill="#fffdf8" stroke="#c9bead" stroke-width="2"/>
<text x="750" y="490" class="small">STATUS</text>
<rect x="750" y="510" width="300" height="48" rx="9" fill="#fffdf8" stroke="#aaa08f"/>
<text x="768" y="540" class="body">Text entry or selection</text>
<rect x="1074" y="510" width="178" height="48" rx="9" class="button"/>
<text x="1163" y="540" class="token" text-anchor="middle">Confirm</text>
<rect x="726" y="602" width="592" height="60" rx="10" class="focus"/>
<text x="750" y="638" class="body">Keyboard focus remains visible and explicit.</text>
<text x="726" y="692" class="small">System sans-serif · native controls · --pui-* tokens · no WebGL/audio</text>
<text x="56" y="790" class="small">Amber communicates an active or primary state. Red is reserved for destructive or error states.</text>
</svg>