name: Generate and publish component library

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: component-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install from npm lockfile
        run: npm ci
      - name: Build standalone bundles
        run: npm run build
      - name: Generate documentation, demos and registry
        run: npm run docs
      - name: Run complete repository checks
        run: npm run check
      - name: Smoke-test the expanded local gallery
        shell: bash
        run: |
          set -euo pipefail
          node tools/serve.mjs > /tmp/pinmotion-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/gallery/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(node --input-type=module -e "import('./tools/spec.mjs').then(({SPEC})=>process.stdout.write(String(SPEC.length)))")" = "29"
          for component in $(node --input-type=module -e "import('./tools/spec.mjs').then(({SPEC})=>process.stdout.write(SPEC.map(c=>c.id).join(' ')))"); do
            curl --fail --silent "http://127.0.0.1:8000/$component/" >/dev/null
            curl --fail --silent "http://127.0.0.1:8000/$component/$component.js" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:8000/registry.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['items']) == 29"
          echo "Expanded site smoke test passed: 29 component routes and bundles."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
          include-hidden-files: true
      - name: Wait for Pages artifact indexing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${EXPECTED_ARTIFACT}\" and .expired == false) | .id" | head -n 1)"
            if [[ -n "$artifact_id" ]]; then
              echo "Pages artifact is visible to the Actions API (ID: $artifact_id)."
              exit 0
            fi
            echo "Pages artifact is not yet visible (attempt $attempt/12)."
            sleep 5
          done
          echo "::error::Uploaded Pages artifact did not become visible before deployment."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Set up Chrome for published-site verification
        id: setup-live-chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Verify the published GitHub Pages site
        shell: bash
        env:
          CHROME: ${{ steps.setup-live-chrome.outputs.chrome-path }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          BASE_URL="${PAGE_URL%/}"
          curl --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --fail --silent --show-error "$BASE_URL/" -o "$RUNNER_TEMP/pinmotion-root.html"
          grep -qi "Pinball UI" "$RUNNER_TEMP/pinmotion-root.html"
          curl --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --fail --silent --show-error "$BASE_URL/gallery/" -o "$RUNNER_TEMP/pinmotion-gallery.html"
          grep -q "gallery-status" "$RUNNER_TEMP/pinmotion-gallery.html"
          curl --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --fail --silent --show-error "$BASE_URL/registry.json" -o "$RUNNER_TEMP/pinmotion-registry.json"
          python3 -c 'import json; d=json.load(open("'"$RUNNER_TEMP"'/pinmotion-registry.json")); assert len(d["items"]) == 29'
          COMPONENTS="$(node --input-type=module -e "import('./tools/spec.mjs').then(({SPEC}) => process.stdout.write(SPEC.map((component) => component.id).join(' ')))")"
          for component in $COMPONENTS; do
            curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --fail --silent --show-error "$BASE_URL/$component/" >/dev/null
            curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --fail --silent --show-error "$BASE_URL/$component/$component.js" >/dev/null
          done
          PINMOTION_LIVE_SMOKE=1 node tools/test.mjs "$BASE_URL/gallery/"
      - name: Capture published gallery at desktop, tablet and mobile widths
        shell: bash
        env:
          CHROME: ${{ steps.setup-live-chrome.outputs.chrome-path }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          READY_JS='new Promise(resolve => { let tries = 0; const poll = () => { const cards = [...document.querySelectorAll("#grid .item")]; if (cards.length === 29 && cards.every(card => card.dataset.loadState === "ready")) resolve(); else if (++tries >= 100) resolve(); else setTimeout(poll, 100); }; poll(); })'
          JS="$READY_JS" WAIT=750 node tools/shot.mjs "$BASE_URL/gallery/" "$RUNNER_TEMP/pinmotion-gallery-desktop" 1440 1000 1
          JS="$READY_JS" WAIT=750 node tools/shot.mjs "$BASE_URL/gallery/" "$RUNNER_TEMP/pinmotion-gallery-tablet" 768 1024 1
          MOBILE=1 JS="$READY_JS" WAIT=750 node tools/shot.mjs "$BASE_URL/gallery/" "$RUNNER_TEMP/pinmotion-gallery-mobile" 390 844 2
      - name: Capture all seven original mechanical demos at desktop, tablet and mobile widths
        shell: bash
        env:
          CHROME: ${{ steps.setup-live-chrome.outputs.chrome-path }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          OUTPUT_DIR="$RUNNER_TEMP/pinmotion-original-controls"
          mkdir -p "$OUTPUT_DIR"
          for component in toggle slider plunger stepper targets drain bumper; do
            curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --fail --silent --show-error "$BASE_URL/$component/" >/dev/null
            READY_JS="new Promise(resolve => { let tries = 0; const poll = () => { const el = document.querySelector('pinball-$component'); if (el && el.shadowRoot) resolve(true); else if (++tries >= 100) resolve(false); else setTimeout(poll, 100); }; poll(); })"
            JS="$READY_JS" WAIT=500 node tools/shot.mjs "$BASE_URL/$component/" "$OUTPUT_DIR/$component-desktop" 1440 1000 1
            JS="$READY_JS" WAIT=500 node tools/shot.mjs "$BASE_URL/$component/" "$OUTPUT_DIR/$component-tablet" 768 1024 1
            MOBILE=1 JS="$READY_JS" WAIT=500 node tools/shot.mjs "$BASE_URL/$component/" "$OUTPUT_DIR/$component-mobile" 390 844 2
          done
          JS='document.querySelector("pinball-toggle").checked = true' WAIT=1200 node tools/shot.mjs "$BASE_URL/toggle/" "$OUTPUT_DIR/toggle-on-desktop" 1440 1000 1
          JS='document.querySelector("pinball-slider").value = 75' WAIT=1200 node tools/shot.mjs "$BASE_URL/slider/" "$OUTPUT_DIR/slider-75-desktop" 1440 1000 1
          for screenshot in "$OUTPUT_DIR"/*.png; do test -s "$screenshot"; done
      - name: Upload Phase 0 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-gallery-visual-evidence
          path: |
            ${{ runner.temp }}/pinmotion-gallery-desktop.png
            ${{ runner.temp }}/pinmotion-gallery-tablet.png
            ${{ runner.temp }}/pinmotion-gallery-mobile.png
            ${{ runner.temp }}/pinmotion-original-controls/
          if-no-files-found: error
          retention-days: 90
