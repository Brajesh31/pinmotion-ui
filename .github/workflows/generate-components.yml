name: Generate and publish component library

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: component-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install from npm lockfile
        run: npm ci
      - name: Build standalone bundles
        run: npm run build
      - name: Generate documentation, demos and registry
        run: npm run docs
      - name: Run complete repository checks
        run: npm run check
      - name: Smoke-test the expanded local gallery
        shell: bash
        run: |
          set -euo pipefail
          node tools/serve.mjs > /tmp/pinmotion-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/gallery/ >/dev/null; then break; fi
            sleep 1
          done
          test "$(node --input-type=module -e "import('./tools/spec.mjs').then(({SPEC})=>process.stdout.write(String(SPEC.length)))")" = "29"
          for component in $(node --input-type=module -e "import('./tools/spec.mjs').then(({SPEC})=>process.stdout.write(SPEC.map(c=>c.id).join(' ')))"); do
            curl --fail --silent "http://127.0.0.1:8000/$component/" >/dev/null
            curl --fail --silent "http://127.0.0.1:8000/$component/$component.js" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:8000/registry.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['items']) == 29"
          echo "Expanded site smoke test passed: 29 component routes and bundles."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
          include-hidden-files: true
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Set up Chrome for published-site verification
        id: setup-live-chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Verify the published GitHub Pages site
        shell: bash
        env:
          CHROME: ${{ steps.setup-live-chrome.outputs.chrome-path }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          BASE_URL="${PAGE_URL%/}"
          curl --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --fail --silent --show-error "$BASE_URL/" -o "$RUNNER_TEMP/pinmotion-root.html"
          grep -qi "Pinball UI" "$RUNNER_TEMP/pinmotion-root.html"
          curl --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --fail --silent --show-error "$BASE_URL/gallery/" -o "$RUNNER_TEMP/pinmotion-gallery.html"
          grep -q "gallery-status" "$RUNNER_TEMP/pinmotion-gallery.html"
          curl --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --fail --silent --show-error "$BASE_URL/registry.json" -o "$RUNNER_TEMP/pinmotion-registry.json"
          python3 -c 'import json; d=json.load(open("'"$RUNNER_TEMP"'/pinmotion-registry.json")); assert len(d["items"]) == 29'
          COMPONENTS="$(node --input-type=module -e "import('./tools/spec.mjs').then(({SPEC}) => process.stdout.write(SPEC.map((component) => component.id).join(' ')))")"
          for component in $COMPONENTS; do
            curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --fail --silent --show-error "$BASE_URL/$component/" >/dev/null
            curl --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --fail --silent --show-error "$BASE_URL/$component/$component.js" >/dev/null
          done
          PINMOTION_LIVE_SMOKE=1 node tools/test.mjs "$BASE_URL/gallery/"
